<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F766E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="שעון עובדות">
  <title>שעון עובדות</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="רישום שעות ותשלום לעובדות, מכל מכשיר.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- SVG icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
  </svg>

  <div id="boot" class="center-screen" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>טוען…</p>
  </div>

  <section id="login" class="center-screen" hidden>
    <div class="login-card">
      <div class="brand-mark lg"><svg class="ic"><use href="#i-clock"/></svg></div>
      <h1>שעון עובדות</h1>
      <p class="muted">רישום שעות ותשלום לעובדות, מכל מכשיר.</p>
      <button id="btn-signin" class="btn btn-primary btn-lg btn-block" type="button">
        <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        התחברות עם Google
      </button>
      <p id="login-error" class="field-error" role="alert"></p>
    </div>
  </section>

  <section id="denied" class="center-screen" hidden>
    <div class="login-card">
      <div class="brand-mark lg danger"><svg class="ic"><use href="#i-alert"/></svg></div>
      <h1>אין הרשאה</h1>
      <p class="muted">החשבון <b id="denied-email" dir="ltr"></b> לא מורשה לגשת למערכת.</p>
      <button id="btn-denied-out" class="btn btn-secondary btn-block" type="button">התחברות עם חשבון אחר</button>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#/" class="brand" aria-label="שעון עובדות – מסך ראשי">
          <span class="brand-mark"><svg class="ic"><use href="#i-clock"/></svg></span>
          <span class="brand-name">שעון עובדות</span>
        </a>
        <nav class="tabs" aria-label="ניווט ראשי">
          <a href="#/" data-nav="home"><svg class="ic"><use href="#i-users"/></svg>עובדות</a>
          <a href="#/summary" data-nav="summary"><svg class="ic"><use href="#i-chart"/></svg>סיכום חודשי</a>
          <a href="#/requests" data-nav="requests"><svg class="ic"><use href="#i-inbox"/></svg>בקשות ועדכונים<span class="nav-badge num" data-badge="requests" hidden></span></a>
          <a href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-gear"/></svg>הגדרות</a>
        </nav>
        <div class="month-switch" role="group" aria-label="בחירת חודש">
          <button class="icon-btn" id="m-prev" type="button" aria-label="חודש קודם"><svg class="ic"><use href="#i-chev-r"/></svg></button>
          <button class="month-label" id="m-label" type="button" aria-label="חזרה לחודש הנוכחי"></button>
          <button class="icon-btn" id="m-next" type="button" aria-label="חודש הבא"><svg class="ic"><use href="#i-chev-l"/></svg></button>
        </div>
      </div>
      <div id="demo-banner" class="demo-banner" hidden>מצב הדגמה – הנתונים נשמרים רק בדפדפן הזה</div>
      <div id="offline-banner" class="demo-banner offline-banner" role="status" hidden>אין חיבור לאינטרנט – כל מה שנרשם נשמר בטלפון ויסונכרן לבד כשהחיבור יחזור</div>
    </header>

    <div id="live" class="live no-print" aria-live="polite" hidden></div>

    <main id="view" tabindex="-1"></main>

    <nav class="bottomnav" aria-label="ניווט ראשי">
      <a href="#/" data-nav="home"><svg class="ic"><use href="#i-users"/></svg><span>עובדות</span></a>
      <a href="#/summary" data-nav="summary"><svg class="ic"><use href="#i-chart"/></svg><span>סיכום</span></a>
      <a href="#/requests" data-nav="requests"><span class="nav-ic"><svg class="ic"><use href="#i-inbox"/></svg><span class="nav-badge num" data-badge="requests" hidden></span></span><span>בקשות</span></a>
      <a href="#/settings" data-nav="settings"><svg class="ic"><use href="#i-gear"/></svg><span>הגדרות</span></a>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="wheel" class="sheet" aria-labelledby="wheel-title"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
