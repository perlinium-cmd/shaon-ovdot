name: ShaonMac
options:
  bundleIdPrefix: com.perlinium
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: J4NT95YV4X
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
targets:
  ShaonMac:
    type: application
    platform: macOS
    sources: [ShaonMac, Shared]
    dependencies:
      - target: ShaonWidgets
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: ShaonMac/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["com.googleusercontent.apps.999670608252-rmb17o1vc8a4ndv95b3s9n46gk0bclp2"]
          - CFBundleURLSchemes: ["shaon"]
        ShaonAppGroup: "$(TeamIdentifierPrefix)com.perlinium.shaon"
        GIDClientID: "999670608252-rmb17o1vc8a4ndv95b3s9n46gk0bclp2.apps.googleusercontent.com"
    settings:
      base:
        PRODUCT_NAME: ShaonMac
        PRODUCT_BUNDLE_IDENTIFIER: com.perlinium.shaon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "שעון עובדות"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShaonMac/ShaonMac.entitlements
  ShaonWidgets:
    type: app-extension
    platform: macOS
    sources:
      - ShaonWidgets
      - Shared
      - ShaonMac/Models/Models.swift
      - ShaonMac/Logic/Pay.swift
      - ShaonMac/Logic/Formatting.swift
      - ShaonMac/Logic/TimeParse.swift
    info:
      path: ShaonWidgets/Info.plist
      properties:
        CFBundleDisplayName: "שעון עובדות"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ShaonAppGroup: "$(TeamIdentifierPrefix)com.perlinium.shaon"
    settings:
      base:
        PRODUCT_NAME: ShaonWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.perlinium.shaon.widgets
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShaonWidgets/ShaonWidgets.entitlements
        SKIP_INSTALL: YES
  ShaonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShaonTests
      # The cases all three apps are tested against, copied into the test bundle (read from there, not from the repo).
      - path: ../shared/pay-cases.json
        buildPhase: resources
      - path: ../shared/money-cases.json
        buildPhase: resources
    dependencies:
      - target: ShaonMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.perlinium.shaon.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShaonMac.app/Contents/MacOS/ShaonMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ShaonMac:
    build:
      targets: { ShaonMac: all }
    test:
      targets: [ShaonTests]
      # The test host must never open the real Firestore store (it shares the container with the installed app).
      commandLineArguments:
        "-demo": true
