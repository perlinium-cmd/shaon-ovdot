# The app as installed on this Mac (tools/build-local.sh). Same code and settings as project.yml, except:
#  - signed like the Perli app: developer certificate, NO provisioning profile, so it never expires;
#  - only unrestricted entitlements (tools/ShaonMac.Local.entitlements): no keychain-access-groups, no app group;
#  - no widget extension, and ShaonAppGroup is empty, so the app never touches a group container
#    (WidgetStore / QuickClock then do nothing);
#  - its own Info.plist (tools/Local-Info.plist, generated) so ShaonMac/Info.plist is never rewritten.
# Keep the rest in step with project.yml.
name: ShaonMacLocal
options:
  bundleIdPrefix: com.perlinium
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: J4NT95YV4X
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.3"
  Xlsx:
    url: https://github.com/jmcnamara/libxlsxwriter
    from: "1.2.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"
targets:
  ShaonMac:
    type: application
    platform: macOS
    sources: [ShaonMac, Shared]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Xlsx
        product: libxlsxwriter
    info:
      path: tools/Local-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["com.googleusercontent.apps.999670608252-rmb17o1vc8a4ndv95b3s9n46gk0bclp2"]
          - CFBundleURLSchemes: ["shaon"]
        ShaonAppGroup: ""
        GIDClientID: "999670608252-rmb17o1vc8a4ndv95b3s9n46gk0bclp2.apps.googleusercontent.com"
    settings:
      base:
        PRODUCT_NAME: ShaonMac
        PRODUCT_BUNDLE_IDENTIFIER: com.perlinium.shaon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "שעון עובדות"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: tools/ShaonMac.Local.entitlements
  ShaonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShaonTests
      - path: ../shared/pay-cases.json
        buildPhase: resources
      - path: ../shared/money-cases.json
        buildPhase: resources
    dependencies:
      - target: ShaonMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.perlinium.shaon.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShaonMac.app/Contents/MacOS/ShaonMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
schemes:
  ShaonMac:
    build:
      targets: { ShaonMac: all }
    test:
      targets: [ShaonTests]
      # The test host must never open the real Firestore store (it shares the container with the installed app).
      commandLineArguments:
        "-demo": true
