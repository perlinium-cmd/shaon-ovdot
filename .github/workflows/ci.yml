name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 26+: has Temporal, which the property tests use to check real hours (the nights the clock moves)
          node-version: 26
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Syntax check JS
        run: for f in public/*.js; do node --check "$f"; done
      - name: Install test dependencies
        run: npm ci
      - name: Pay calculation tests (shared cases + 100,000 random shifts against an independent oracle)
        run: npm test
      - name: Firestore security rules tests (emulator)
        run: npm run test:rules
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unit tests + build (shared pay cases included)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
